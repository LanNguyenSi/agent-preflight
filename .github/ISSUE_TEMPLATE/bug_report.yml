name: Bug report
description: Report a defect in agent-preflight
labels: ["bug"]
body:
  - type: dropdown
    id: check
    attributes:
      label: Failing check
      options:
        - lint
        - typecheck
        - test
        - audit / secrets
        - act simulation
        - confidence scoring
        - other / unsure
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Expected vs. actual behavior.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
      description: Minimal commands or repo state that trigger the bug.
      render: bash
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: agent-preflight version
      placeholder: "0.x.y"
  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: "20.x"
  - type: input
    id: os
    attributes:
      label: OS
      placeholder: "macOS 14 / Ubuntu 22.04 / Windows 11"
