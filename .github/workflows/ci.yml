name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 20.19.0 is the lowest supported Node.js (see engines in package.json).
        node-version: ['20.19.0', '20', '22']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      # Lint once on the latest Node.js; the rule set is version-independent.
      - run: npm run lint
        if: matrix.node-version == '22'
      - run: npx tsc --noEmit --skipLibCheck
      - run: npx tsc --noEmit -p tsconfig.test.json
      - run: npx vitest run --coverage
