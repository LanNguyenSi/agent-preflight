name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22 is the oldest Node.js in CI; 24 is the current LTS. engines in
        # package.json still allows 20.19.0, which CI no longer exercises.
        node-version: ['22', '24']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      # Lint once (on 22); the rule set is version-independent.
      - run: npm run lint
        if: matrix.node-version == '22'
      - run: npx tsc --noEmit --skipLibCheck
      - run: npx tsc --noEmit -p tsconfig.test.json
      - run: npx vitest run --coverage
